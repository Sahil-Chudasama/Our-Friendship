<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our-Friendship</title>

    <!-- Social Media Link Share Preview -->
    <meta property="title" content="Our-Friendship">
    <meta property="description" content="A special surprise for you...">
    <meta property="og:title" content="Our-Friendship">
    <meta property="og:description" content="A special surprise for you...">
    <meta property="og:type" content="website">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #ff2a5f;
            --secondary-color: #ff758f;
            --bg-light: #fff0f5;
            --sky-top: #cbeaff;
            --sky-bottom: #eef8ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 72%, #dff4e4 100%);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: background 0.5s ease;
        }

        body.stage2-active {
            background: linear-gradient(135deg, var(--bg-light) 0%, #ffe4e1 100%);
        }

        /* --- STAGE 1: MAILBOX SCENE --- */
        .mailbox-stage {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 14px;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .mailbox-stage.fade-away {
            opacity: 0;
            transform: scale(0.92);
            pointer-events: none;
        }

        .stage1-row {
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        /* --- GRASS GROUND UNDER DOG & MAILBOX POST --- */
        .grass-ground {
            position: relative;
            width: min(460px, 94vw);
            height: 54px;
            margin-top: -14px;
            z-index: 6;
            pointer-events: none;
        }

        .grass-svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        /* --- SPARROW FLIGHT & PERCH ANIMATION --- */
        .sparrow-flight-box {
            position: absolute;
            top: 76px;
            left: 185px;
            z-index: 12;
            pointer-events: none;
            opacity: 0;
            transform: translate3d(55vw, -95px, 0);
        }

        .sparrow-flight-box.fly-in {
            opacity: 1;
            transform: translate3d(0, 0, 0);
            transition: transform 2.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease;
        }

        .sparrow-flight-box.fly-in .sparrow-wing,
        .sparrow-flight-box.fly-out .sparrow-wing {
            animation: wingFlap 0.22s ease-in-out infinite;
        }

        .sparrow-flight-box.perched {
            opacity: 1;
            transform: translate3d(0, 0, 0);
        }

        .sparrow-flight-box.perched .sparrow-svg {
            transform: scaleX(-1);
        }

        .sparrow-flight-box.fly-out {
            opacity: 0;
            transform: translate3d(-130vw, 20px, 0);
            transition: transform 3.6s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.6s ease 2.8s;
        }

        .sparrow-bubble {
            position: absolute;
            top: -38px;
            left: 50%;
            transform: translateX(-50%) scale(0.85);
            background: #ffffff;
            color: var(--primary-color);
            border: 2px solid #ff8fa3;
            border-radius: 18px;
            padding: 4px 11px;
            font-family: 'Dancing Script', cursive;
            font-size: 0.95rem;
            font-weight: 700;
            white-space: nowrap;
            opacity: 0;
            box-shadow: 0 6px 14px rgba(255, 42, 95, 0.16);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .sparrow-bubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid #ff8fa3;
        }

        .sparrow-flight-box.perched .sparrow-bubble {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .sparrow-svg {
            width: 52px;
            height: 44px;
            overflow: visible;
            transform: scaleX(-1);
        }

        .sparrow-wing {
            transform-origin: 25px 23px;
        }

        @keyframes wingFlap {
            0%, 100% { transform: rotate(24deg); }
            50% { transform: rotate(-34deg); }
        }

        /* --- SITTING DOG ANIMATION --- */
        .sitting-dog-box {
            position: relative;
            width: 104px;
            height: 126px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            margin-right: -12px;
            margin-bottom: -12px;
            z-index: 5;
            cursor: pointer;
        }

        .dog-bubble {
            position: absolute;
            top: -12px;
            left: -6px;
            background: #ffffff;
            color: var(--primary-color);
            border: 2px solid #ff8fa3;
            border-radius: 24px;
            padding: 4px 10px;
            font-family: 'Dancing Script', cursive;
            font-size: 0.95rem;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: 0 6px 14px rgba(255, 42, 95, 0.14);
        }

        .dog-bubble::before {
            content: '';
            position: absolute;
            bottom: -7px;
            right: 20px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #ff8fa3;
        }

        .dog-bubble::after {
            content: '';
            position: absolute;
            bottom: -14px;
            right: 13px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #ff8fa3;
        }

        .heart-hint {
            position: absolute;
            top: 12px;
            right: 10px;
            font-size: 1.15rem;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }

        .sitting-dog-box.happy .heart-hint {
            animation: heartPop 0.8s ease-out forwards;
        }

        @keyframes heartPop {
            0% { opacity: 0; transform: translateY(0) scale(0.5); }
            50% { opacity: 1; transform: translateY(-18px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-30px) scale(0.8); }
        }

        .dog-svg {
            width: 100px;
            height: 106px;
            overflow: visible;
        }

        .dog-tail {
            transform-origin: 27px 82px;
            animation: tailWag 1.1s ease-in-out infinite;
        }

        .sitting-dog-box.excited .dog-tail,
        .sitting-dog-box.happy .dog-tail {
            animation: tailWagFast 0.3s ease-in-out infinite;
        }

        .dog-head-group {
            transform-origin: 61px 45px;
            transition: transform 0.3s ease;
        }

        .sitting-dog-box.happy .dog-head-group {
            transform: rotate(-12deg);
        }

        @keyframes tailWag {
            0%, 100% { transform: rotate(-14deg); }
            50% { transform: rotate(18deg); }
        }

        @keyframes tailWagFast {
            0%, 100% { transform: rotate(-24deg); }
            50% { transform: rotate(26deg); }
        }

        .mailbox-wrapper {
            position: relative;
            width: 220px;
            height: 345px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: scale(0.84);
            transform-origin: bottom center;
        }

        .mailbox-post {
            position: absolute;
            bottom: 0;
            left: 128px;
            width: 26px;
            height: 225px;
            background: linear-gradient(90deg, #8d5524 0%, #a96a38 50%, #6f4019 100%);
            border-radius: 0 0 12px 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            z-index: 1;
        }

        .mailbox-flag {
            position: absolute;
            top: 15px;
            right: 22px;
            width: 8px;
            height: 58px;
            background: #334155;
            border-radius: 4px;
            transform-origin: bottom center;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2;
        }

        .mailbox-flag::after {
            content: '';
            position: absolute;
            top: 0;
            left: 6px;
            width: 34px;
            height: 22px;
            background: var(--primary-color);
            border-radius: 0 6px 6px 0;
            box-shadow: 0 3px 8px rgba(255, 42, 95, 0.4);
        }

        .mailbox-wrapper.opened .mailbox-flag {
            transform: rotate(75deg);
        }

        .mailbox-body {
            position: absolute;
            top: 58px;
            left: 20px;
            width: 195px;
            height: 105px;
            background: linear-gradient(135deg, #ff758f 0%, #ff4d6d 100%);
            border-radius: 52px 52px 12px 12px;
            box-shadow: 0 15px 30px rgba(255, 42, 95, 0.3);
            z-index: 3;
            border: 3px solid #ffffff;
            cursor: pointer;
        }

        .mailbox-interior {
            position: absolute;
            top: 61px;
            left: 20px;
            width: 82px;
            height: 99px;
            background: #4a0e1c;
            border-radius: 50px 50px 8px 8px;
            z-index: 4;
        }

        .mailbox-door {
            position: absolute;
            top: 58px;
            left: 18px;
            width: 86px;
            height: 105px;
            background: linear-gradient(180deg, #ff8fa3 0%, #ff2a5f 100%);
            border: 3px solid #ffffff;
            border-radius: 52px 52px 10px 10px;
            z-index: 6;
            transform-origin: top center;
            transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 2px 4px 12px rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }

        .mailbox-wrapper.opened .mailbox-door {
            transform: rotateX(145deg) translateY(-12px);
        }

        .mini-letter {
            position: absolute;
            top: 22px;
            left: 12px;
            width: 88px;
            height: 58px;
            background: #fff0f3;
            border: 2px solid #ff2a5f;
            border-radius: 8px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
            z-index: 5;
            opacity: 0;
            transform: translateX(15px) scale(0.7);
            transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
            cursor: pointer;
        }

        .mini-letter::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            border-left: 42px solid transparent;
            border-right: 42px solid transparent;
            border-top: 30px solid #ffb3c1;
        }

        .mailbox-wrapper.opened .mini-letter {
            opacity: 1;
            transform: translateX(-48px) translateY(8px) rotate(-8deg) scale(1);
            animation: miniLetterShake 1.1s ease-in-out infinite 0.75s;
        }

        @keyframes miniLetterShake {
            0%, 100% { transform: translateX(-48px) translateY(8px) rotate(-8deg) scale(1); }
            20% { transform: translateX(-48px) translateY(4px) rotate(-14deg) scale(1.06); }
            40% { transform: translateX(-48px) translateY(8px) rotate(-2deg) scale(1.06); }
            60% { transform: translateX(-48px) translateY(5px) rotate(-12deg) scale(1.04); }
            80% { transform: translateX(-48px) translateY(8px) rotate(-4deg) scale(1.02); }
        }

        /* --- STAGE 2: CENTER ENVELOPE & QR PULL-UP --- */
        .envelope-stage {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, var(--bg-light) 0%, #ffe4e1 100%);
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .envelope-stage.active {
            display: flex;
            animation: fadeInModal 0.4s ease forwards;
        }

        @keyframes fadeInModal {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .big-envelope-wrapper {
            position: relative;
            width: 310px;
            height: 200px;
            margin-top: 20px;
            perspective: 800px;
            transition: opacity 0.4s ease;
            animation: popCenter 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .big-envelope-wrapper.hidden-env {
            opacity: 0;
            pointer-events: none;
        }

        @keyframes popCenter {
            0% { transform: scale(0.35) translateY(35px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .env-back {
            position: absolute;
            inset: 0;
            background: #e65275;
            border-radius: 8px;
            box-shadow: 0 18px 40px rgba(255, 42, 95, 0.25);
            z-index: 1;
        }

        .env-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 155px solid transparent;
            border-right: 155px solid transparent;
            border-top: 110px solid #ff2a5f;
            transform-origin: top center;
            transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5;
            cursor: pointer;
        }

        .big-envelope-wrapper.flap-opened .env-flap {
            transform: rotateX(180deg);
            z-index: 0;
        }

        .env-pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 310px;
            height: 200px;
            background: linear-gradient(180deg, #ff8fa3 0%, #ff758f 100%);
            border-radius: 0 0 8px 8px;
            clip-path: polygon(0 0, 50% 48%, 100% 0, 100% 100%, 0 100%);
            z-index: 4;
            pointer-events: none;
        }

        .friendship-seal {
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 7;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 30%, #ff4d6d 0%, #d90429 65%, #800f2f 100%);
            color: #ffffff;
            border: 3px solid #ffd166;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: 'Dancing Script', cursive;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.3),
                inset 0 2px 5px rgba(255, 255, 255, 0.45),
                inset 0 -4px 8px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .friendship-seal:hover {
            transform: translateX(-50%) scale(1.06);
        }

        .friendship-seal.breaking {
            animation: sealBreakAnim 0.65s ease-in-out forwards;
            pointer-events: none;
        }

        @keyframes sealBreakAnim {
            0% { transform: translateX(-50%) rotate(0deg) scale(1); opacity: 1; }
            20% { transform: translateX(-50%) rotate(-12deg) scale(1.15); }
            40% { transform: translateX(-50%) rotate(12deg) scale(1.15); }
            60% { transform: translateX(-50%) rotate(-10deg) scale(1.1); opacity: 0.85; }
            80% { transform: translateX(-50%) rotate(8deg) scale(0.9); opacity: 0.4; }
            100% { transform: translateX(-50%) scale(0.4); opacity: 0; }
        }

        .qr-card {
            position: absolute;
            top: 45px;
            left: 50%;
            transform: translateX(-50%) translateY(0);
            width: 190px;
            background: #ffffff;
            padding: 8px;
            border-radius: 12px;
            z-index: 2;
            opacity: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s ease;
            touch-action: none;
        }

        .big-envelope-wrapper.flap-opened .qr-card.peek-20 {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(-50px);
            z-index: 3;
            cursor: grab;
        }

        .big-envelope-wrapper.flap-opened .qr-card.peek-20:active {
            cursor: grabbing;
        }

        .qr-card.full-center {
            position: fixed;
            top: 50%;
            left: 50%;
            opacity: 1;
            pointer-events: auto;
            width: auto;
            max-width: 85vw;
            padding: 16px;
            transform: translate(-50%, -50%) !important;
            z-index: 999 !important;
            cursor: default;
        }

        .qr-card img {
            width: 174px;
            height: 174px;
            max-width: 72vw;
            max-height: 72vw;
            aspect-ratio: 1 / 1;
            display: block;
            object-fit: contain;
            pointer-events: none;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.12));
        }

        .qr-card.full-center img {
            width: 220px;
            height: 220px;
        }

        .qr-label {
            display: none;
            margin-top: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary-color);
            text-align: center;
        }

        .qr-card.full-center .qr-label {
            display: block;
        }

        .download-png-btn {
            display: none;
            margin-top: 10px;
            padding: 8px 18px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(255, 42, 95, 0.28);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .download-png-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(255, 42, 95, 0.35);
        }

        .download-png-btn:active {
            transform: scale(0.96);
        }

        .qr-card.full-center .download-png-btn {
            display: inline-block;
        }

        .env-instruction {
            position: relative;
            z-index: 10;
            margin-top: 65px;
            color: var(--primary-color);
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            animation: pulseText 1.6s infinite;
        }

        @keyframes pulseText {
            0%, 100% { transform: translateY(0); opacity: 0.9; }
            50% { transform: translateY(-4px); opacity: 1; }
        }

        /* --- TOP CENTER SUN --- */
        .sky-sun-bar {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 16px;
            margin-bottom: 8px;
            pointer-events: none;
            z-index: 2;
            transition: opacity 0.4s ease;
        }

        body.stage2-active .sky-sun-bar {
            opacity: 0;
        }

        .sky-sun {
            width: 72px;
            height: 72px;
            flex-shrink: 0;
        }

        .sun-svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }
    </style>
</head>
<body>

    <div class="sky-sun-bar" aria-hidden="true">
        <div class="sky-sun">
            <svg class="sun-svg" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <radialGradient id="sunGlowGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#fff3a1"/>
                        <stop offset="65%" stop-color="#ffd166"/>
                        <stop offset="100%" stop-color="#ffaa2b"/>
                    </radialGradient>
                </defs>
                <g stroke="#ffbe3b" stroke-width="3" stroke-linecap="round">
                    <line x1="40" y1="5" x2="40" y2="12"/>
                    <line x1="40" y1="68" x2="40" y2="75"/>
                    <line x1="5" y1="40" x2="12" y2="40"/>
                    <line x1="68" y1="40" x2="75" y2="40"/>
                    <line x1="15.2" y1="15.2" x2="20.2" y2="20.2"/>
                    <line x1="59.8" y1="59.8" x2="64.8" y2="64.8"/>
                    <line x1="64.8" y1="15.2" x2="59.8" y2="20.2"/>
                    <line x1="20.2" y1="59.8" x2="15.2" y2="64.8"/>
                </g>
                <g>
                    <circle cx="40" cy="40" r="19" fill="url(#sunGlowGrad)"/>
                    <circle cx="34.5" cy="39.5" r="2.1" fill="#5c3a16"/>
                    <circle cx="45.5" cy="39.5" r="2.1" fill="#5c3a16"/>
                    <ellipse cx="31.5" cy="43" rx="2.6" ry="1.4" fill="#ff8fa3" opacity="0.65"/>
                    <ellipse cx="48.5" cy="43" rx="2.6" ry="1.4" fill="#ff8fa3" opacity="0.65"/>
                    <path d="M36.5 44.5 Q40 48 43.5 44.5" fill="none" stroke="#5c3a16" stroke-width="1.8" stroke-linecap="round"/>
                </g>
            </svg>
        </div>
    </div>

    <!-- STAGE 1: MAILBOX -->
    <div id="mailboxStage" class="mailbox-stage">
        <div class="stage1-row">
            <!-- Flying Sparrow -->
            <div id="sparrowBox" class="sparrow-flight-box">
                <div class="sparrow-bubble">sahil made something for you</div>
                <svg class="sparrow-svg" viewBox="0 0 60 50" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="10,28 2,24 4,33" fill="#8d5524"/>
                    <ellipse cx="26" cy="28" rx="15" ry="10" fill="#c97a4b"/>
                    <ellipse cx="29" cy="30" rx="9" ry="6.5" fill="#fff5f7"/>
                    <circle cx="39" cy="20" r="8.5" fill="#d98a5b"/>
                    <polygon points="47,19 54,21 47,23.5" fill="#f59e0b"/>
                    <circle cx="41" cy="18.5" r="1.8" fill="#2d1b14"/>
                    <circle cx="41.5" cy="18" r="0.6" fill="#ffffff"/>
                    <g class="sparrow-wing">
                        <ellipse cx="25" cy="23" rx="9" ry="5" transform="rotate(-12 25 23)" fill="#a96a38"/>
                    </g>
                    <path d="M23 37 L23 42 M20 42 L26 42 M30 37 L30 42 M27 42 L33 42" stroke="#6f4019" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </div>

            <div id="sittingDog" class="sitting-dog-box" onclick="handleDogClick(event)">
                <div id="dogBubble" class="dog-bubble">Letter waiting!</div>
                <div class="heart-hint">💖</div>
                <svg class="dog-svg" viewBox="0 0 110 115" xmlns="http://www.w3.org/2000/svg">
                    <g class="dog-tail">
                        <path d="M27 82 Q21 74 24 67" fill="none" stroke="#c97a4b" stroke-width="6.5" stroke-linecap="round"/>
                        <circle cx="24" cy="67" r="3.5" fill="#fff5f7"/>
                    </g>
                    <ellipse cx="48" cy="82" rx="24" ry="25" fill="#d98a5b"/>
                    <ellipse cx="52" cy="85" rx="14" ry="18" fill="#fff5f7"/>
                    <ellipse cx="34" cy="102" rx="11" ry="6.5" fill="#c97a4b"/>
                    <g class="dog-head-group">
                        <ellipse cx="43" cy="34" rx="8" ry="17" transform="rotate(18 43 34)" fill="#b86638"/>
                        <ellipse cx="78" cy="34" rx="8" ry="17" transform="rotate(-18 78 34)" fill="#b86638"/>
                        <circle cx="61" cy="45" r="22" fill="#e09263"/>
                        <ellipse cx="64" cy="51" rx="11" ry="8.5" fill="#fff5f7"/>
                        <circle cx="53" cy="42" r="3" fill="#2d1b14"/>
                        <circle cx="69" cy="42" r="3" fill="#2d1b14"/>
                        <circle cx="54" cy="41" r="1" fill="#ffffff"/>
                        <circle cx="70" cy="41" r="1" fill="#ffffff"/>
                        <ellipse cx="64" cy="48.5" rx="3.8" ry="2.6" fill="#2d1b14"/>
                        <path d="M59.5 53.5 Q64 58 68.5 53.5" fill="none" stroke="#2d1b14" stroke-width="2" stroke-linecap="round"/>
                    </g>
                    <ellipse cx="54" cy="102" rx="7.5" ry="6" fill="#e09263"/>
                    <ellipse cx="68" cy="102" rx="7.5" ry="6" fill="#e09263"/>
                </svg>
            </div>

            <div id="mailboxWrapper" class="mailbox-wrapper">
                <div class="mailbox-flag"></div>
                <div class="mailbox-body" onclick="openMailbox()"></div>
                <div class="mailbox-interior">
                    <div id="miniLetter" class="mini-letter" onclick="openCenterEnvelope(event)"></div>
                </div>
                <div class="mailbox-door" onclick="openMailbox()"></div>
                <div class="mailbox-post"></div>
            </div>
        </div>

        <!-- GRASS GROUND UNDER DOG & POST -->
        <div class="grass-ground" aria-hidden="true">
            <svg class="grass-svg" viewBox="0 0 460 56" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0 18 Q55 10 115 17 T230 16 T345 18 T460 15 L460 56 L0 56 Z" fill="#8fd19e"/>
                <path d="M0 24 Q70 18 140 25 T280 23 T460 25 L460 56 L0 56 Z" fill="#6ab982"/>
                <g fill="#57a36e">
                    <path d="M24 22 L20 11 L28 21 Z"/>
                    <path d="M36 22 L35 9 L41 21 Z"/>
                    <path d="M118 22 L114 10 L122 21 Z"/>
                    <path d="M132 23 L133 12 L138 22 Z"/>
                    <path d="M255 22 L251 11 L259 21 Z"/>
                    <path d="M268 22 L269 10 L274 21 Z"/>
                    <path d="M388 22 L384 11 L392 21 Z"/>
                    <path d="M402 22 L403 10 L408 21 Z"/>
                </g>
            </svg>
        </div>
    </div>

    <!-- STAGE 2: CENTER ENVELOPE & PULL-UP QR -->
    <div id="envelopeStage" class="envelope-stage">
        <div id="bigEnvelope" class="big-envelope-wrapper" onclick="handleEnvelopeTap()">
            <div class="env-back"></div>
            <div class="env-flap"></div>
            <div id="qrCard" class="qr-card">
                <img id="qrImage" src="raw/qr_code.png" alt="Scan me" draggable="false">
                <div class="qr-label">Use Google lens for scan</div>
                <button id="downloadPngBtn" class="download-png-btn" type="button" onclick="downloadQrPng(event)">Download QR</button>
            </div>
            <div class="env-pocket"></div>
            <div id="friendshipSeal" class="friendship-seal" onclick="breakFriendshipSeal(event)">
                Friendship
            </div>
        </div>
        <div id="envInstruction" class="env-instruction">Tap seal to break it</div>
    </div>

    <script>
        let isMailboxOpened = false;
        let isSealBroken = false;
        let isFlapOpened = false;
        let isQrPulled = false;
        let dogHappyTimer = null;

        let sparrowCycleTimer = null;
        let sparrowStageTimers = [];
        let sparrowLoopRunning = false;

        function clearSparrowTimers() {
            if (sparrowCycleTimer) {
                clearTimeout(sparrowCycleTimer);
                sparrowCycleTimer = null;
            }
            sparrowStageTimers.forEach((id) => clearTimeout(id));
            sparrowStageTimers = [];
        }

        function stopSparrowCycle() {
            sparrowLoopRunning = false;
            clearSparrowTimers();
            const sparrow = document.getElementById("sparrowBox");
            if (!sparrow) return;

            sparrow.classList.remove("fly-in", "perched", "fly-out");
            sparrow.style.transition = "opacity 0.25s ease";
            sparrow.style.opacity = "0";
        }

        function startSparrowLoop() {
            if (isMailboxOpened || sparrowLoopRunning) return;
            const sparrow = document.getElementById("sparrowBox");
            if (!sparrow) return;

            sparrowLoopRunning = true;

            function runSingleCycle() {
                if (isMailboxOpened || !sparrowLoopRunning) {
                    stopSparrowCycle();
                    return;
                }

                clearSparrowTimers();
                sparrow.style.transition = "none";
                sparrow.classList.remove("fly-in", "perched", "fly-out");
                sparrow.style.opacity = "0";
                sparrow.style.transform = "translate3d(55vw, -95px, 0)";

                void sparrow.offsetWidth;

                sparrow.style.opacity = "";
                sparrow.style.transform = "";
                sparrow.style.transition = "";
                sparrow.classList.add("fly-in");

                sparrowStageTimers.push(setTimeout(() => {
                    if (isMailboxOpened || !sparrowLoopRunning) {
                        stopSparrowCycle();
                        return;
                    }
                    sparrow.classList.remove("fly-in");
                    sparrow.classList.add("perched");
                }, 2200));

                sparrowStageTimers.push(setTimeout(() => {
                    if (isMailboxOpened || !sparrowLoopRunning) {
                        stopSparrowCycle();
                        return;
                    }
                    sparrow.classList.remove("perched");
                    sparrow.classList.add("fly-out");
                }, 5000));

                sparrowCycleTimer = setTimeout(() => {
                    if (!isMailboxOpened && sparrowLoopRunning) {
                        runSingleCycle();
                    } else {
                        stopSparrowCycle();
                    }
                }, 10400);
            }

            runSingleCycle();
        }

        startSparrowLoop();

        history.replaceState({ stage: "initial" }, "", "");

        function pushStageState(stageName) {
            history.pushState({ stage: stageName }, "", "");
        }

        function handleDogClick(event) {
            event.stopPropagation();
            if (isMailboxOpened) return;

            const dog = document.getElementById("sittingDog");
            const dogBubble = document.getElementById("dogBubble");

            if (dogHappyTimer) clearTimeout(dogHappyTimer);

            dog.classList.add("happy");
            dogBubble.innerText = "Woof! Woof!";

            dogHappyTimer = setTimeout(() => {
                if (!isMailboxOpened) {
                    dog.classList.remove("happy");
                    dogBubble.innerText = "Letter waiting!";
                }
            }, 2500);
        }

        function resetToMailboxStage() {
            const mailboxStage = document.getElementById("mailboxStage");
            const envelopeStage = document.getElementById("envelopeStage");
            const bigEnvelope = document.getElementById("bigEnvelope");
            const qrCard = document.getElementById("qrCard");
            const seal = document.getElementById("friendshipSeal");
            const instruction = document.getElementById("envInstruction");
            const dog = document.getElementById("sittingDog");
            const dogBubble = document.getElementById("dogBubble");

            isSealBroken = false;
            isFlapOpened = false;
            isQrPulled = false;

            if (dogHappyTimer) clearTimeout(dogHappyTimer);

            document.body.classList.remove("stage2-active");
            bigEnvelope.classList.remove("hidden-env", "flap-opened");
            qrCard.classList.remove("peek-20", "full-center");
            qrCard.style.transform = "";
            seal.classList.remove("breaking");
            seal.style.display = "flex";
            instruction.style.display = "block";
            instruction.innerText = "Tap seal to break it";

            if (dog) dog.classList.remove("excited", "happy");
            if (dogBubble) dogBubble.innerText = "Letter waiting!";

            envelopeStage.classList.remove("active");
            mailboxStage.style.display = "flex";
            requestAnimationFrame(() => {
                mailboxStage.classList.remove("fade-away");
            });

            if (!isMailboxOpened) {
                startSparrowLoop();
            }
        }

        function resetToEnvelopePeek() {
            const bigEnvelope = document.getElementById("bigEnvelope");
            const qrCard = document.getElementById("qrCard");
            const instruction = document.getElementById("envInstruction");

            isQrPulled = false;
            bigEnvelope.classList.remove("hidden-env");
            bigEnvelope.classList.add("flap-opened");
            qrCard.classList.remove("full-center");
            qrCard.classList.add("peek-20");
            qrCard.style.transform = "translateX(-50%) translateY(-50px)";
            instruction.style.display = "block";
            instruction.innerText = "Pull out";
        }

        window.addEventListener("popstate", (event) => {
            const stage = event.state && event.state.stage;

            if (isQrPulled) {
                resetToEnvelopePeek();
            } else if (document.getElementById("envelopeStage").classList.contains("active")) {
                resetToMailboxStage();
            } else if (!stage || stage === "initial") {
                const wrapper = document.getElementById("mailboxWrapper");
                const dog = document.getElementById("sittingDog");
                const dogBubble = document.getElementById("dogBubble");
                isMailboxOpened = false;
                if (dogHappyTimer) clearTimeout(dogHappyTimer);
                wrapper.classList.remove("opened");
                if (dog) dog.classList.remove("excited", "happy");
                if (dogBubble) dogBubble.innerText = "Letter waiting!";
                startSparrowLoop();
            }
        });

        function openMailbox() {
            if (isMailboxOpened) return;
            isMailboxOpened = true;
            stopSparrowCycle();
            pushStageState("mailbox-opened");

            if (dogHappyTimer) clearTimeout(dogHappyTimer);

            const wrapper = document.getElementById("mailboxWrapper");
            const dog = document.getElementById("sittingDog");
            const dogBubble = document.getElementById("dogBubble");

            wrapper.classList.add("opened");
            if (dog) {
                dog.classList.remove("happy");
                dog.classList.add("excited");
            }
            if (dogBubble) dogBubble.innerText = "It's here!";
        }

        function openCenterEnvelope(event) {
            event.stopPropagation();
            if (!isMailboxOpened) {
                openMailbox();
                return;
            }

            stopSparrowCycle();
            pushStageState("envelope-stage");

            const mailboxStage = document.getElementById("mailboxStage");
            const envelopeStage = document.getElementById("envelopeStage");

            document.body.classList.add("stage2-active");
            mailboxStage.classList.add("fade-away");
            setTimeout(() => {
                mailboxStage.style.display = "none";
                envelopeStage.classList.add("active");
            }, 350);
        }

        function breakFriendshipSeal(event) {
            event.stopPropagation();
            if (isSealBroken) return;
            isSealBroken = true;

            const seal = document.getElementById("friendshipSeal");
            const instruction = document.getElementById("envInstruction");

            seal.classList.add("breaking");
            setTimeout(() => {
                seal.style.display = "none";
                instruction.innerText = "Open The Envelope";
            }, 600);
        }

        function handleEnvelopeTap() {
            if (!isSealBroken || isFlapOpened) return;
            isFlapOpened = true;

            const bigEnvelope = document.getElementById("bigEnvelope");
            const qrCard = document.getElementById("qrCard");
            const instruction = document.getElementById("envInstruction");

            bigEnvelope.classList.add("flap-opened");

            setTimeout(() => {
                qrCard.classList.add("peek-20");
                instruction.innerText = "Pull out";
                enableQrPullGesture();
            }, 450);
        }

        function revealFullQrCard() {
            if (isQrPulled) return;
            isQrPulled = true;
            pushStageState("qr-full");

            const bigEnvelope = document.getElementById("bigEnvelope");
            const qrCard = document.getElementById("qrCard");
            const instruction = document.getElementById("envInstruction");

            bigEnvelope.classList.add("hidden-env");
            qrCard.classList.remove("peek-20");
            qrCard.classList.add("full-center");
            instruction.style.display = "none";
        }

        function downloadQrPng(event) {
            event.stopPropagation();
            const img = document.getElementById("qrImage");
            const link = document.createElement("a");
            link.href = img.getAttribute("src");
            link.download = "qr_code.png";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function enableQrPullGesture() {
            const qrCard = document.getElementById("qrCard");
            if (qrCard.dataset.pullBound === "true") return;
            qrCard.dataset.pullBound = "true";

            let startY = 0;
            let currentDeltaY = 0;
            let isDragging = false;

            function snapBackQrCard() {
                isDragging = false;
                qrCard.style.transition = "transform 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
                qrCard.style.transform = "translateX(-50%) translateY(-50px)";
            }

            qrCard.addEventListener("pointerdown", (e) => {
                if (isQrPulled || (e.target && e.target.closest("#downloadPngBtn"))) return;
                e.stopPropagation();
                isDragging = true;
                startY = e.clientY;
                currentDeltaY = 0;
                qrCard.style.transition = "none";
                qrCard.setPointerCapture(e.pointerId);
            });

            qrCard.addEventListener("pointermove", (e) => {
                if (!isDragging || isQrPulled) return;
                currentDeltaY = e.clientY - startY;
                if (currentDeltaY < 0) {
                    const pullOffset = Math.max(-50 + currentDeltaY, -180);
                    qrCard.style.transform = `translateX(-50%) translateY(${pullOffset}px)`;
                }
            });

            qrCard.addEventListener("pointerup", () => {
                if (!isDragging || isQrPulled) return;
                if (currentDeltaY <= -45) {
                    isDragging = false;
                    revealFullQrCard();
                } else {
                    snapBackQrCard();
                }
            });

            qrCard.addEventListener("pointercancel", () => {
                if (!isDragging || isQrPulled) return;
                snapBackQrCard();
            });
        }
    </script>
</body>
